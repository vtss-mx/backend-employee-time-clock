# Configuración de herramientas de calidad del backend (python scripts/quality.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Usar APIs obsoletas desde el código de la app hace fallar las pruebas (detección temprana).
filterwarnings = [
  "error::DeprecationWarning:app(\\..*)?$",
]

[tool.coverage.run]
source = ["app"]
branch = true
# Sin exclusiones: los motores reales (OpenCV/ONNX) se prueban con los modelos de la imagen de
# desarrollo (tests/test_face_engine_real.py) y la CLI con sus propias pruebas.

[tool.coverage.report]
# 100 % de líneas y ramas: el código que no se puede ejecutar se elimina (sin `pragma: no cover`).
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
# Las migraciones conservan el formato con que se aplicaron (una migración aplicada no se edita).
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle / pyflakes
  "I",             # orden de imports
  "UP",            # sintaxis/APIs obsoletas para la versión de Python
  "B",             # bugs probables
  "ANN",           # anotaciones de tipo faltantes
  "C90",           # complejidad ciclomática
  "SIM", "C4",     # simplificaciones
  "RUF",           # reglas propias de ruff
  "S",             # seguridad (bandit)
  "DTZ",           # fechas sin zona horaria
  "PIE", "RET",
]
ignore = [
  "ANN401",  # Any explícito permitido en límites genéricos (contrato de respuesta)
  "S101",    # assert (solo en pruebas)
  "RUF001", "RUF002", "RUF003",  # textos en español con caracteres ambiguos (á, ¿, ¡)
  "B008",    # Depends()/File() en firmas: patrón estándar de FastAPI
  "RET504",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "DTZ", "C90", "PLR2004"]
"scripts/**" = ["S"]
# Códigos de catálogo como PASSWORD_CHANGED no son contraseñas (falso positivo de S105).
"app/models/enums.py" = ["S105"]
# Migraciones: de todo el lint, SOLO la regla de inyección SQL (S608, regla 21 de la raíz): una migración nueva que
# arme SQL con algo que no sea constante falla aquí (y en tests/test_sql_safety.py, que además entiende f-strings con
# `sql_identifier`). El resto del estilo no aplica a archivos que no se editan una vez aplicados.
"alembic/versions/*.py" = [
  "E", "W", "F", "I", "UP", "B", "ANN", "C90", "SIM", "C4", "RUF", "DTZ", "PIE", "RET",
  "S1", "S2", "S3", "S4", "S5", "S7", "S601", "S602", "S603", "S604", "S605", "S606", "S607", "S609", "S610", "S611",
]
# Migraciones YA APLICADAS que arman SQL con sus propias constantes (nombres de tablas, índices, códigos de catálogo):
# revisadas una por una en la auditoría de inyección SQL (2026-10-05; motivos en FROZEN_MIGRATIONS de
# tests/test_sql_safety.py). No se editan; nunca se agrega aquí una migración nueva.
"alembic/versions/{0011,0014,0016,0038,0041,0061,0062,0064,0065,0066,0067,0068,0069}_*.py" = ["S608"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
packages = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
strict_equality = true

[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true
ignore-comments = true
ignore-docstrings = true
ignore-signatures = true
